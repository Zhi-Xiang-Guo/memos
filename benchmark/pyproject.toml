[project]
name = "memos-benchmark"
version = "0.1.0"
description = "Provider-neutral black-box benchmark harness for MemOS"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[project.scripts]
memos-benchmark = "memos_benchmark.cli:main"
memos-retrieval-conformance-report = "memos_benchmark.retrieval_conformance_report:main"
memos-temporal-conformance-report = "memos_benchmark.temporal_conformance_report:main"
memos-write-policy-report = "memos_benchmark.write_policy_report:main"
memos-dataset-verify = "memos_benchmark.dataset:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memos_benchmark"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
