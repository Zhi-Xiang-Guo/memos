name: memos

services:
  postgres:
    image: ${MEMOS_POSTGRES_IMAGE:-pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a}
    environment:
      POSTGRES_DB: ${MEMOS_DB_NAME:-memos}
      POSTGRES_USER: ${MEMOS_DB_USER:-memos}
      POSTGRES_PASSWORD: ${MEMOS_DB_PASSWORD:-memos-local}
    ports:
      - "${MEMOS_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - memos-postgres:/var/lib/postgresql

volumes:
  memos-postgres:
