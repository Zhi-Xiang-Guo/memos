spring:
  application:
    name: memos-worker
  datasource:
    url: ${MEMOS_DB_URL:jdbc:postgresql://localhost:5432/memos}
    username: ${MEMOS_DB_USER:memos}
    password: ${MEMOS_DB_PASSWORD:memos-local}
  flyway:
    default-schema: public
    clean-disabled: true
    validate-migration-naming: true
memos:
  audit:
    policy-version: ${MEMOS_AUDIT_POLICY_VERSION:access-control-v1}
  deletion:
    policy-version: ${MEMOS_DELETION_POLICY_VERSION:privacy-v1}
    max-attempts: ${MEMOS_DELETION_MAX_ATTEMPTS:5}
    worker-id: ${MEMOS_DELETION_WORKER_ID:}
    poll-delay: ${MEMOS_DELETION_POLL_DELAY:1s}
    batch-size: ${MEMOS_DELETION_BATCH_SIZE:8}
    lease-duration: ${MEMOS_DELETION_LEASE_DURATION:30s}
    backoff-base: ${MEMOS_DELETION_BACKOFF_BASE:1s}
    backoff-cap: ${MEMOS_DELETION_BACKOFF_CAP:60s}
  ingestion:
    policy-version: ${MEMOS_INGESTION_POLICY_VERSION:ingestion-v1}
    model-version: ${MEMOS_MATERIALIZATION_MODEL_VERSION:deterministic-fake-v1}
    max-attempts: ${MEMOS_MATERIALIZATION_MAX_ATTEMPTS:5}
  extraction:
    provider: ${MEMOS_EXTRACTION_PROVIDER:fake}
    base-url: ${MEMOS_EXTRACTION_BASE_URL:}
    api-key: ${MEMOS_EXTRACTION_API_KEY:}
    model-version: ${MEMOS_EXTRACTION_MODEL_VERSION:deterministic-fixture-v1}
    prompt-version: ${MEMOS_EXTRACTION_PROMPT_VERSION:candidate-extraction-v1}
    schema-version: ${MEMOS_EXTRACTION_SCHEMA_VERSION:memory-candidate.v1}
    policy-version: ${MEMOS_EXTRACTION_POLICY_VERSION:write-policy-v1}
    timeout: ${MEMOS_EXTRACTION_TIMEOUT:30s}
  embedding:
    provider: ${MEMOS_EMBEDDING_PROVIDER:fake}
    base-url: ${MEMOS_EMBEDDING_BASE_URL:}
    model-tag: ${MEMOS_EMBEDDING_MODEL_TAG:}
    model-version: ${MEMOS_EMBEDDING_MODEL_VERSION:deterministic-hashing-1024-v1}
    model-digest: ${MEMOS_EMBEDDING_MODEL_DIGEST:}
    dimensions: ${MEMOS_EMBEDDING_DIMENSIONS:1024}
    timeout: ${MEMOS_EMBEDDING_TIMEOUT:300s}
  temporal:
    projection-policy-version: ${MEMOS_PROJECTION_POLICY_VERSION:projection-v1}
    projection-model-version: ${MEMOS_EMBEDDING_MODEL_VERSION:deterministic-hashing-1024-v1}
    set-valued-predicates: ${MEMOS_SET_VALUED_PREDICATES:preference.coffee,preference.cuisine}
  retrieval:
    embedding-model-version: ${MEMOS_EMBEDDING_MODEL_VERSION:deterministic-hashing-1024-v1}
    reranker-model-version: ${MEMOS_RERANKER_MODEL_VERSION:pass-through-v1}
    reranking-enabled: ${MEMOS_RERANKING_ENABLED:false}
    reranker-timeout: ${MEMOS_RERANKER_TIMEOUT:150ms}
    rrf-k: ${MEMOS_RRF_K:60}
  worker:
    enabled: true
    worker-id: ${MEMOS_WORKER_ID:}
    poll-delay: ${MEMOS_WORKER_POLL_DELAY:1s}
    batch-size: ${MEMOS_WORKER_BATCH_SIZE:16}
    lease-duration: ${MEMOS_WORKER_LEASE_DURATION:30s}
    backoff-base: ${MEMOS_WORKER_BACKOFF_BASE:1s}
    backoff-cap: ${MEMOS_WORKER_BACKOFF_CAP:60s}
server:
  port: ${MEMOS_WORKER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: server:/livez
        readiness:
          include: readinessState,db
          additional-path: server:/readyz
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    role: worker
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
