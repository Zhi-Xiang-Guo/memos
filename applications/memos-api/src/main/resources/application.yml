spring:
  application:
    name: memos-api
  datasource:
    url: ${MEMOS_DB_URL:jdbc:postgresql://localhost:5432/memos}
    username: ${MEMOS_DB_USER:memos}
    password: ${MEMOS_DB_PASSWORD:memos-local}
  flyway:
    default-schema: public
    clean-disabled: true
    validate-migration-naming: true
memos:
  audit:
    policy-version: ${MEMOS_AUDIT_POLICY_VERSION:access-control-v1}
  security:
    issuer: ${MEMOS_JWT_ISSUER:memos-local}
    audience: ${MEMOS_JWT_AUDIENCE:memos-api}
    hmac-secret: ${MEMOS_JWT_HMAC_SECRET:memos-local-development-secret-change-me-now}
  deletion:
    policy-version: ${MEMOS_DELETION_POLICY_VERSION:privacy-v1}
    max-attempts: ${MEMOS_DELETION_MAX_ATTEMPTS:5}
    worker-id: ""
    batch-size: 8
    lease-duration: 30s
    backoff-base: 1s
    backoff-cap: 60s
  ingestion:
    policy-version: ${MEMOS_INGESTION_POLICY_VERSION:ingestion-v1}
    model-version: ${MEMOS_EXTRACTION_MODEL_VERSION:deterministic-fixture-v1}
    max-attempts: ${MEMOS_MATERIALIZATION_MAX_ATTEMPTS:5}
  worker:
    enabled: false
    worker-id: ""
    batch-size: 16
    lease-duration: 30s
    backoff-base: 1s
    backoff-cap: 60s
  embedding:
    provider: ${MEMOS_EMBEDDING_PROVIDER:fake}
    base-url: ${MEMOS_EMBEDDING_BASE_URL:}
    model-tag: ${MEMOS_EMBEDDING_MODEL_TAG:}
    model-version: ${MEMOS_EMBEDDING_MODEL_VERSION:deterministic-hashing-1024-v1}
    model-digest: ${MEMOS_EMBEDDING_MODEL_DIGEST:}
    dimensions: ${MEMOS_EMBEDDING_DIMENSIONS:1024}
    timeout: ${MEMOS_EMBEDDING_TIMEOUT:300s}
  temporal:
    projection-policy-version: ${MEMOS_PROJECTION_POLICY_VERSION:projection-v1}
    projection-model-version: ${MEMOS_EMBEDDING_MODEL_VERSION:deterministic-hashing-1024-v1}
    set-valued-predicates: ${MEMOS_SET_VALUED_PREDICATES:preference.coffee,preference.cuisine}
  retrieval:
    embedding-model-version: ${MEMOS_EMBEDDING_MODEL_VERSION:deterministic-hashing-1024-v1}
    reranker-model-version: ${MEMOS_RERANKER_MODEL_VERSION:pass-through-v1}
    reranking-enabled: ${MEMOS_RERANKING_ENABLED:false}
    reranker-timeout: ${MEMOS_RERANKER_TIMEOUT:150ms}
    rrf-k: ${MEMOS_RRF_K:60}
server:
  port: ${MEMOS_API_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: server:/livez
        readiness:
          include: readinessState,db
          additional-path: server:/readyz
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    role: api
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
