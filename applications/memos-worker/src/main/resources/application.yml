spring:
  application:
    name: memos-worker
  datasource:
    url: ${MEMOS_DB_URL:jdbc:postgresql://localhost:5432/memos}
    username: ${MEMOS_DB_USER:memos}
    password: ${MEMOS_DB_PASSWORD:memos-local}
  flyway:
    clean-disabled: true
    validate-migration-naming: true
server:
  port: ${MEMOS_WORKER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: server:/livez
        readiness:
          include: readinessState,db
          additional-path: server:/readyz
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    role: worker
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
