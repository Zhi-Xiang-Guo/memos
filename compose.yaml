name: memos

services:
  postgres:
    image: ${MEMOS_POSTGRES_IMAGE:-pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a}
    environment:
      POSTGRES_DB: ${MEMOS_DB_NAME:-memos}
      POSTGRES_USER: ${MEMOS_DB_USER:-memos}
      POSTGRES_PASSWORD: ${MEMOS_DB_PASSWORD:-memos-local}
    ports:
      - "127.0.0.1:${MEMOS_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - memos-postgres:/var/lib/postgresql
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    image: memos-api:local
    env_file:
      - path: .env
        required: false
    environment: &application-environment
      MEMOS_DB_URL: jdbc:postgresql://postgres:5432/${MEMOS_DB_NAME:-memos}
      MEMOS_DB_USER: ${MEMOS_DB_USER:-memos}
      MEMOS_DB_PASSWORD: ${MEMOS_DB_PASSWORD:-memos-local}
      MEMOS_API_PORT: 8080
      MEMOS_WORKER_PORT: 8081
    ports:
      - "127.0.0.1:${MEMOS_API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 512m
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    image: memos-worker:local
    env_file:
      - path: .env
        required: false
    environment: *application-environment
    ports:
      - "127.0.0.1:${MEMOS_WORKER_PORT:-18081}:8081"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081; printf \"GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 512m
    restart: unless-stopped

volumes:
  memos-postgres:
