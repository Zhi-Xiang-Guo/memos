spring:
  application:
    name: memos-api
  datasource:
    url: ${MEMOS_DB_URL:jdbc:postgresql://localhost:5432/memos}
    username: ${MEMOS_DB_USER:memos}
    password: ${MEMOS_DB_PASSWORD:memos-local}
  flyway:
    default-schema: public
    clean-disabled: true
    validate-migration-naming: true
memos:
  ingestion:
    policy-version: ${MEMOS_INGESTION_POLICY_VERSION:ingestion-v1}
    model-version: ${MEMOS_MATERIALIZATION_MODEL_VERSION:deterministic-fake-v1}
    max-attempts: ${MEMOS_MATERIALIZATION_MAX_ATTEMPTS:5}
  worker:
    enabled: false
    worker-id: ""
    batch-size: 16
    lease-duration: 30s
    backoff-base: 1s
    backoff-cap: 60s
server:
  port: ${MEMOS_API_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: server:/livez
        readiness:
          include: readinessState,db
          additional-path: server:/readyz
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    role: api
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
